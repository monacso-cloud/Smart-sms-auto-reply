plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartreply.beta'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smartsmsreply.app'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.0.0-rc1'
    }

    signingConfigs {
        release {
            def ks = System.getenv('SMART_SMS_RELEASE_KEYSTORE')
            def pw = System.getenv('SMART_SMS_RELEASE_STORE_PASSWORD')
            if (ks && pw) {
                storeFile file(ks)
                storePassword pw
                keyAlias 'smart-sms-reply'
                keyPassword pw
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.work:work-runtime:2.9.1'
}
