plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smartreply.beta'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smartreply.beta'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.5.3-menu-fix-test'
    }

    signingConfigs {
        debug {
            // CI supplies the restored test key explicitly so updates keep the same signer.
            def testKey = System.getenv('SMART_SMS_TEST_KEYSTORE')
            if (testKey) {
                storeFile file(testKey)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            // The old APK used a different signer; keep test installations separate.
            applicationIdSuffix '.menutest'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.work:work-runtime:2.9.1'
}
