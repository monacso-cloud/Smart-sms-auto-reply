name: Build Android Pilot APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/pilot-license-v0.2
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unpack Android project and apply pilot source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'Smart-SMS-Reply-Advanced-Source*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -type f -name settings.gradle | head -n 1)")
          test -f "$PROJECT_DIR/settings.gradle"

          MAIN_DEST=$(find "$PROJECT_DIR" -type f -name MainActivity.java | head -n 1)
          RECEIVER_DEST=$(find "$PROJECT_DIR" -type f -name PhoneStateReceiver.java | head -n 1)
          LAYOUT_DEST=$(find "$PROJECT_DIR" -type f -path '*/res/layout/activity_main.xml' | head -n 1)
          MANIFEST_DEST=$(find "$PROJECT_DIR" -type f -name AndroidManifest.xml | head -n 1)
          test -n "$MAIN_DEST"
          test -n "$RECEIVER_DEST"
          test -n "$LAYOUT_DEST"
          test -n "$MANIFEST_DEST"

          cp MainActivity.java "$MAIN_DEST"
          cp PhoneStateReceiver.java "$RECEIVER_DEST"
          cp LicenseManager.java "$(dirname "$MAIN_DEST")/LicenseManager.java"
          cp activity_main.xml "$LAYOUT_DEST"
          cp AndroidManifest.xml "$MANIFEST_DEST"
          cp build.gradle "$PROJECT_DIR/app/build.gradle"
          cp proguard-rules.pro "$PROJECT_DIR/app/proguard-rules.pro"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SMS-Reply-Pilot-v0.2
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
