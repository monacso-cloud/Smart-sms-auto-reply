name: Build ReplyDesk Automated SMS Bot Production Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - production-clean-v1

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and build release APK and AAB
        run: |
          gradle clean testDebugUnitTest assembleRelease bundleRelease --stacktrace

      - name: Verify production APK package name
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > package.txt
          grep -q "package: name='com.smartsmsreply.app'" package.txt

      - name: Prepare ReplyDesk production artifacts
        run: |
          test -f app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/apk/release/app-release-unsigned.apk "ReplyDesk-Automated-SMS-Bot-v1.0.0-RC2-Unsigned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "ReplyDesk-Automated-SMS-Bot-v1.0.0-RC2-Unsigned.aab"

      - name: Upload ReplyDesk production candidates
        uses: actions/upload-artifact@v4
        with:
          name: ReplyDesk-Automated-SMS-Bot-v1.0.0-RC2-Production-Candidates
          path: |
            ReplyDesk-Automated-SMS-Bot-v1.0.0-RC2-Unsigned.apk
            ReplyDesk-Automated-SMS-Bot-v1.0.0-RC2-Unsigned.aab
          if-no-files-found: error
          retention-days: 30
