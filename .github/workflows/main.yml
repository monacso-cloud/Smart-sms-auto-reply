name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unpack Android project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'Smart-SMS-Reply-Advanced-Source*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -type f -name settings.gradle | head -n 1)")
          test -f "$PROJECT_DIR/settings.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply missed-call reliability fix
        shell: bash
        run: |
          RECEIVER=$(find "$PROJECT_DIR" -type f -name PhoneStateReceiver.java | head -n 1)
          test -n "$RECEIVER"
          python3 - "$RECEIVER" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          source = source.replace("Thread.sleep(1800L);", "Thread.sleep(5000L);")
          source = source.replace(
              'if (now - lastReply < 24L * 60L * 60L * 1000L) return;',
              '// Every missed call may receive a reply when that option is selected.'
          )
          source = source.replace(
              '} catch (Exception ignored) {\n            // A later version will expose detailed error logs in the dashboard.\n        }',
              '} catch (Exception error) {\n            android.util.Log.e("SmartSmsReply", "Missed-call auto reply failed", error);\n        }'
          )
          path.write_text(source)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SMS-Reply-Advanced-Fixed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
