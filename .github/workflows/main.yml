name: Build Smart SMS Reply Production Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - production-clean-v1

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and build unsigned release APK
        run: |
          gradle clean testDebugUnitTest assembleRelease --stacktrace

      - name: Verify production package name
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > package.txt
          grep -q "package: name='com.smartsmsreply.app'" package.txt

      - name: Name unsigned release APK
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk Smart-SMS-Reply-v1.0.0-RC1-Unsigned.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SMS-Reply-v1.0.0-RC1-Unsigned
          path: Smart-SMS-Reply-v1.0.0-RC1-Unsigned.apk
          if-no-files-found: error
          retention-days: 30
