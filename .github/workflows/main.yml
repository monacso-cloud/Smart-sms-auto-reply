name: Build repaired Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Keep one stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: smart-sms-reply-test-signing-v1

      - name: Create test signing key on first build
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Smart SMS Reply Test,O=Ying Thai,C=AU" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build debug APK
        run: |
          export SMART_SMS_TEST_KEYSTORE="$HOME/.android/debug.keystore"
          gradle clean testDebugUnitTest assembleDebug --stacktrace

      - name: Verify signing certificate matches v0.5.2
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > signer.txt
          cat signer.txt
          python3 - <<'PY'
          from pathlib import Path
          expected = '8cfc8df429036a80421f794dee8e2b4fd5d691327ee1970ed8e777345cecbee7'
          lines = Path('signer.txt').read_text().splitlines()
          actual = [line.split(': ', 1)[1].strip().lower() for line in lines if line.startswith('Signer #1 certificate SHA-256 digest: ')]
          if actual != [expected]:
              raise SystemExit('Signing certificate differs from v0.5.2; do not distribute as an in-place update.')
          PY

      - name: Give APK a clear versioned name
        run: cp app/build/outputs/apk/debug/app-debug.apk Smart-SMS-Reply-Advanced-v0.5.3-Menu-Fix-Test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SMS-Reply-Advanced-v0.5.3-Menu-Fix-Test
          path: Smart-SMS-Reply-Advanced-v0.5.3-Menu-Fix-Test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Save regression test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SMS-Reply-v0.5.3-Test-Results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
