name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unpack Android project
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'Smart-SMS-Reply-Advanced-Source*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -type f -name settings.gradle | head -n 1)")
          test -f "$PROJECT_DIR/settings.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SMS-Reply-Advanced
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
