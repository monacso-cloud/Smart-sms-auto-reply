name: Build repaired Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace

      - name: Give APK a clear versioned name
        run: cp app/build/outputs/apk/debug/app-debug.apk Smart-SMS-Reply-Advanced-v0.4-Test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SMS-Reply-Advanced-v0.4-Test
          path: Smart-SMS-Reply-Advanced-v0.4-Test.apk
          if-no-files-found: error
          retention-days: 14
