name: Build Smart SMS Reply Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - production/smart-sms-v1.0.0-rc1

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore production signing key
        env:
          SMART_SMS_RELEASE_KEYSTORE_B64: ${{ secrets.SMART_SMS_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$SMART_SMS_RELEASE_KEYSTORE_B64"
          mkdir -p "$HOME/.android"
          printf '%s' "$SMART_SMS_RELEASE_KEYSTORE_B64" | base64 --decode > "$HOME/.android/smart-sms-reply-production.jks"
          chmod 600 "$HOME/.android/smart-sms-reply-production.jks"

      - name: Run tests and build signed release APK
        env:
          SMART_SMS_RELEASE_KEYSTORE: /home/runner/.android/smart-sms-reply-production.jks
          SMART_SMS_RELEASE_STORE_PASSWORD: ${{ secrets.SMART_SMS_RELEASE_STORE_PASSWORD }}
          SMART_SMS_RELEASE_KEY_PASSWORD: ${{ secrets.SMART_SMS_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$SMART_SMS_RELEASE_STORE_PASSWORD"
          test -n "$SMART_SMS_RELEASE_KEY_PASSWORD"
          gradle clean testDebugUnitTest assembleRelease --stacktrace

      - name: Verify release signature and package
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > signer.txt
          cat signer.txt
          grep -qi "Signer #1 certificate SHA-256 digest: b75a689cf031e3954fa9d8353366b8adf045a01bdaf4f6e5cf3ae9133a1af26b" signer.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > package.txt
          grep -q "package: name='com.smartsmsreply.app'" package.txt

      - name: Name production candidate APK
        run: cp app/build/outputs/apk/release/app-release.apk Smart-SMS-Reply-v1.0.0-RC1-Production-Signed.apk

      - name: Upload production candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-SMS-Reply-v1.0.0-RC1-Production-Signed
          path: Smart-SMS-Reply-v1.0.0-RC1-Production-Signed.apk
          if-no-files-found: error
          retention-days: 30
