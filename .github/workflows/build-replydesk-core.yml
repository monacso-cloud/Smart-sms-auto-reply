name: Build ReplyDesk Core Android

on:
  push:
    branches:
      - feature/replydesk-platform-foundation
    paths:
      - "android-advanced/**"
      - ".github/workflows/build-replydesk-core.yml"
  pull_request:
    paths:
      - "android-advanced/**"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Build ReplyDesk Core debug APK
        run: gradle -p android-advanced testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: ReplyDesk-Core-Debug
          path: android-advanced/app/build/outputs/apk/debug/app-debug.apk
