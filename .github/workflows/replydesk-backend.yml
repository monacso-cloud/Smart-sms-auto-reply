name: ReplyDesk backend checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "railway.toml"
  push:
    branches:
      - "feature/replydesk-platform-foundation"
    paths:
      - "backend/**"
      - "railway.toml"

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run check
